<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Information Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      line-height: 1.5;
      color: #333;
    }
    .form-container {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      text-align: left;
    }
    h2 { text-align: center; color: #1a1a1a; margin-top: 0; margin-bottom: 24px; font-size: 22px; }
    label { display: block; margin-top: 16px; font-weight: 600; color: #4a4a4a; font-size: 14px; margin-bottom: 6px; }
    
    input[type="text"], input[type="number"], input[type="tel"] {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 16px; transition: border-color 0.2s, box-shadow 0.2s; color: #1a1a1a;
    }
    input[type="file"] {
      width: 100%; padding: 8px; border: 1px dashed #d1d5db; border-radius: 6px;
      font-size: 14px; background: #f9fafb; cursor: pointer; color: #4a4a4a;
    }
    input:focus, input[type="file"]:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15); }
    
    .file-hint { font-size: 12px; color: #6b7280; margin-top: 6px; margin-bottom: 0; }

    button {
      width: 100%; margin-top: 24px; padding: 12px; background: #007bff; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }

    .success-message {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px 0; text-align: center;
    }
    .success-icon {
      width: 72px; height: 72px; background: #dcfce7; color: #16a34a; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 36px;
      margin-bottom: 16px; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .success-message h3 { color: #16a34a; margin: 0 0 8px 0; font-size: 20px; }
    .success-message p { color: #6b7280; margin: 0 0 20px 0; font-size: 14px; line-height: 1.5; }
    .reset-btn { margin-top: 0; background: #16a34a; width: auto; padding: 10px 24px; }
    .reset-btn:hover { background: #15803d; }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="form-container">
    
    <!-- 1. REMOVED "/ajax/" FROM URL. 2. ADDED target="hidden_iframe" -->
    <form id="customerForm" action="https://formsubmit.co/artificialinte@atomicmail.io" method="POST" enctype="multipart/form-data" target="hidden_iframe" onsubmit="handleFormSubmit()">
      
      <!-- FormSubmit Configuration -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <h2>Customer Info</h2>
      
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" placeholder="25" min="1" max="120" required>

      <label for="number">Phone Number</label>
      <input type="tel" id="number" name="number" placeholder="+1 234 567 8900" required>

      <label for="attachment">Upload File (Optional)</label>
      <input type="file" id="attachment" name="attachment" accept="image/*,.pdf,.doc,.docx,.txt">
      <div class="file-hint">Max size: 25MB. Formats: Images, PDF, Word, Text.</div>

      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <!-- 3. THE INVISIBLE IFRAME THAT CATCHES THE SUBMISSION -->
    <iframe name="hidden_iframe" style="display:none;"></iframe>

    <!-- SUCCESS MESSAGE -->
    <div id="successMessage" class="success-message">
      <div class="success-icon">✓</div>
      <h3>Submitted Successfully!</h3>
      <p>Thank you. We have received your information and file.</p>
      <button class="reset-btn" onclick="resetForm()">Submit Another</button>
    </div>

  </div>

  <script>
    // 4. JAVASCRIPT TO HANDLE THE UI SWAP WITHOUT REDIRECTING
    function handleFormSubmit() {
      const btn = document.getElementById("submitBtn");
      btn.innerText = "Uploading...";
      btn.disabled = true;

      // Listen for the hidden iframe to finish loading (meaning upload is done)
      const iframe = document.querySelector('iframe[name="hidden_iframe"]');
      
      iframe.addEventListener('load', function onLoad() {
        // Remove listener so it doesn't trigger again
        iframe.removeEventListener('load', onLoad);
        
        // Hide form, show success message
        document.getElementById("customerForm").style.display = "none";
        document.getElementById("successMessage").style.display = "flex";
        
        // Reset form in background for next time
        document.getElementById("customerForm").reset();
        btn.innerText = "Submit";
        btn.disabled = false;
      }, { once: true });
    }

    function resetForm() {
      document.getElementById("successMessage").style.display = "none";
      document.getElementById("customerForm").style.display = "block";
    }
  </script>

</body>
</html>
