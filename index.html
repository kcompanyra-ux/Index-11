<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Information Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 350px;
    }
    h2 { 
      text-align: center; 
      color: #333; 
      margin-bottom: 20px;
    }
    label { 
      display: block; 
      margin-top: 15px; 
      font-weight: 600; 
      color: #555;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #007bff;
    }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover { 
      background: #0056b3; 
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Customer Info</h2>
    
    <!-- Your Formspree endpoint is integrated here -->
    <form action="https://formspree.io/f/xyegqwoj" method="POST">
      
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" placeholder="25" min="1" max="120" required>

      <label for="number">Phone Number</label>
      <input type="tel" id="number" name="number" placeholder="+1 234 567 8900" required>

      <button type="submit">Submit</button>
      
    </form>
  </div>

</body>
</html>
